name: OctoPrint dependency security audit
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: read
jobs:
  advisories:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.10.11'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - run: uvx --python 3.13 pip-audit==2.10.1 --path '.venv/lib/python${{ matrix.python }}/site-packages' --skip-editable

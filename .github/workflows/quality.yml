name: Plugin quality and registry checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  MOSQUITTO_BINARY: /usr/sbin/mosquitto
  MOSQUITTO_CONFIG_DIRECTORY: /etc/mosquitto/conf.d/mqtt-relay-tests
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
        mqtt: ['0.8.19', '0.8.20']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.10.11'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - run: uv pip check
      - run: uv run python tools/prepare_upstream.py
      - run: uv run python tools/install_upstream.py --mqtt-version '${{ matrix.mqtt }}'
      - run: uv run ruff check octoprint_mqttforusbrelaycontrol tests tools
      - run: uv run mypy --python-version '${{ matrix.python }}' octoprint_mqttforusbrelaycontrol
      - run: uv run pytest tests/unit tests/integration/test_upstream_contracts.py --cov=octoprint_mqttforusbrelaycontrol --cov-fail-under=85
      - name: Prepare isolated broker
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" "$MOSQUITTO_CONFIG_DIRECTORY"
      - run: RUN_SERVICE_TESTS=1 uv run pytest tests/integration/test_services.py tests/integration/test_authorization.py tests/integration/test_missing_hardware.py
      - name: Diagnose broker confinement failures
        if: failure()
        run: sudo journalctl -k --grep='apparmor="DENIED".*mosquitto' --no-pager --lines=10
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.10.11'
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
      - run: npm install --global pnpm@11.29.0
      - run: uv sync --locked --group dev
      - run: uv run python tools/install_upstream.py --mqtt-version 0.8.20
      - run: pnpm install --frozen-lockfile
      - run: pnpm test && pnpm typecheck && pnpm lint && pnpm format:check
      - run: pnpm audit
      - name: Prepare isolated broker
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" "$MOSQUITTO_CONFIG_DIRECTORY"
      - run: PLAYWRIGHT_BROWSERS_PATH=artifacts/browsers pnpm exec playwright install --with-deps chromium
      - run: RUN_BROWSER_TESTS=1 PLAYWRIGHT_BROWSERS_PATH=artifacts/browsers uv run pytest tests/integration/test_browser.py -s
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.10.11'
          python-version: '3.14'
      - run: uv venv .ha --python 3.14
      - run: uv pip install --python .ha/bin/python homeassistant==2026.11.3 paho-mqtt==2.1.0 pytest==9.2.0
      - run: uv sync --locked --python 3.13 --group dev
      - run: uv run python tools/install_upstream.py --mqtt-version 0.8.20
      - name: Prepare isolated broker
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" "$MOSQUITTO_CONFIG_DIRECTORY"
      - run: RUN_HA_TESTS=1 TEST_OCTOPRINT_PYTHON="$PWD/.venv/bin/python" .ha/bin/python -m pytest tests/ha
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.10.11'
          python-version: '3.13'
      - run: uv sync --locked --group dev
      - run: uv run python tools/update_translations.py
      - run: uv run python -m build --outdir artifacts/dist
      - run: uv run python tools/check_artifact.py artifacts/dist/*.whl artifacts/dist/*.tar.gz
      - run: uv run python tools/export_public_source.py artifacts/dist/local-source.zip
      - run: uv run python tools/verify_artifact_negatives.py artifacts/dist/*.whl artifacts/dist/*.tar.gz artifacts/dist/local-source.zip
      - name: Prepare isolated broker
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" "$MOSQUITTO_CONFIG_DIRECTORY"
      - run: uv run python tools/verify_installation.py --source artifacts/dist/local-source.zip --artifacts artifacts/dist/*.whl artifacts/dist/*.tar.gz artifacts/dist/local-source.zip
  registry:
    name: Official plugin registry validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.10.11'
          python-version: '3.11'
      - run: uv run --no-project --python 3.11 python tools/validate_registry_fixtures.py --prepare-only
      - run: uv venv .registry --python 3.11
      - run: uv pip install --python .registry/bin/python -r artifacts/registry-validator/requirements.txt
      - run: .registry/bin/python tools/validate_registry_fixtures.py
      - run: .registry/bin/python tools/validate_registry_entry.py
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: OctoPrint/plugins.octoprint.org
          ref: 95c543a6dda048df2a8edca7596e7549e0cb6fcb
          path: artifacts/official-registry
          persist-credentials: false
      - name: Add project listing to the isolated official registry
        run: |
          cp extras/mqttforusbrelaycontrol.md artifacts/official-registry/_plugins/mqttforusbrelaycontrol.md
          mkdir -p artifacts/official-registry/assets/img/plugins/mqttforusbrelaycontrol
          cp extras/assets/img/plugins/mqttforusbrelaycontrol/*.png artifacts/official-registry/assets/img/plugins/mqttforusbrelaycontrol/
      - name: Refresh official registry video thumbnails
        working-directory: artifacts/official-registry
        run: bash .github/scripts/fetch_yt_preview
      - name: Validate the complete official registry
        working-directory: artifacts/official-registry
        run: ../../.registry/bin/python .github/scripts/validate_front_matter.py --check-id-match --check-asset-match --action-output
      - uses: ruby/setup-ruby@20eb24b0d509e2b9ed9b6d42ddfeb992915e0564 # v1.341.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: artifacts/official-registry
      - name: Build the official registry with the project listing
        working-directory: artifacts/official-registry
        run: bundle exec jekyll build --future --trace
      - name: Validate generated registry feeds and project entry
        run: .registry/bin/python tools/validate_registry_site.py artifacts/official-registry/_site

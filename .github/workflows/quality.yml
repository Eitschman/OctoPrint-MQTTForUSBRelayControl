name: Local-equivalent quality checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
        mqtt: ['0.8.19', '0.8.20']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.10.11'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - run: uv run python tools/prepare_upstream.py
      - run: uv run python tools/install_upstream.py --mqtt-version '${{ matrix.mqtt }}'
      - run: uv run ruff check octoprint_mqttforusbrelaycontrol tests tools
      - run: uv run mypy --python-version '${{ matrix.python }}' octoprint_mqttforusbrelaycontrol
      - run: uv run pytest tests/unit tests/integration/test_upstream_contracts.py --cov=octoprint_mqttforusbrelaycontrol --cov-fail-under=85
      - run: sudo apt-get update && sudo apt-get install -y mosquitto
      - run: RUN_SERVICE_TESTS=1 uv run pytest tests/integration/test_services.py tests/integration/test_authorization.py tests/integration/test_missing_hardware.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.10.11'
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
      - run: npm install --global pnpm@11.29.0
      - run: uv sync --locked --group dev
      - run: uv run python tools/install_upstream.py --mqtt-version 0.8.20
      - run: pnpm install --frozen-lockfile
      - run: pnpm test && pnpm typecheck && pnpm lint && pnpm format:check
      - run: pnpm audit
      - run: sudo apt-get update && sudo apt-get install -y mosquitto
      - run: PLAYWRIGHT_BROWSERS_PATH=artifacts/browsers pnpm exec playwright install --with-deps chromium
      - run: RUN_BROWSER_TESTS=1 PLAYWRIGHT_BROWSERS_PATH=artifacts/browsers uv run pytest tests/integration/test_browser.py -s
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.10.11'
          python-version: '3.14'
      - run: uv venv .ha --python 3.14
      - run: uv pip install --python .ha/bin/python homeassistant==2026.11.3 paho-mqtt==2.1.0 pytest==9.2.0
      - run: uv sync --locked --python 3.13 --group dev
      - run: uv run python tools/install_upstream.py --mqtt-version 0.8.20
      - run: sudo apt-get update && sudo apt-get install -y mosquitto
      - run: RUN_HA_TESTS=1 TEST_OCTOPRINT_PYTHON="$PWD/.venv/bin/python" .ha/bin/python -m pytest tests/ha
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.10.11'
          python-version: '3.13'
      - run: uv sync --locked --group dev
      - run: uv run python tools/update_translations.py
      - run: uv run python -m build --outdir artifacts/dist
      - run: uv run python tools/check_artifact.py artifacts/dist/*.whl artifacts/dist/*.tar.gz
      - run: uv run python tools/export_public_source.py artifacts/dist/local-source.zip
      - run: uv run python tools/verify_artifact_negatives.py artifacts/dist/*.whl artifacts/dist/*.tar.gz artifacts/dist/local-source.zip
      - run: sudo apt-get update && sudo apt-get install -y mosquitto
      - run: uv run python tools/verify_installation.py --source artifacts/dist/local-source.zip --artifacts artifacts/dist/*.whl artifacts/dist/*.tar.gz artifacts/dist/local-source.zip
  advisories:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.10.11'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - run: uvx --python 3.13 pip-audit==2.10.1 --path '.venv/lib/python${{ matrix.python }}/site-packages' --skip-editable

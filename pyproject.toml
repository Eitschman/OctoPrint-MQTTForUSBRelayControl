[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "OctoPrint-MQTTForUSBRelayControl"
dynamic = ["version"]
readme = "README.md"
dependencies = ["OctoPrint>=1.11.2"]
classifiers = ["Framework :: OctoPrint", "Development Status :: 2 - Pre-Alpha", "Programming Language :: Python :: 3"]
description = "Event-driven MQTT companion for OctoPrint USB Relay Control"
requires-python = ">=3.11"

[dependency-groups]
dev = [
  "pytest==9.2.0", "pytest-cov==6.3.0", "ruff==0.14.6", "mypy==1.19.0",
  "build==1.3.0", "babel==2.18.0", "OctoPrint==2.0.1; python_version < '3.16'", "paho-mqtt==2.2.0", "six==1.17.0", "pip==26.3",
]

[project.entry-points."octoprint.plugin"]
mqttforusbrelaycontrol = "octoprint_mqttforusbrelaycontrol"

[tool.setuptools.dynamic]
version = {attr = "octoprint_mqttforusbrelaycontrol._version.__version__"}

[tool.setuptools.packages.find]
include = ["octoprint_mqttforusbrelaycontrol*"]

[tool.setuptools.package-data]
octoprint_mqttforusbrelaycontrol = ["templates/*.jinja2", "static/js/*.js", "static/css/*.css", "translations/*/LC_MESSAGES/*.mo", "translations/*/LC_MESSAGES/*.po", "translations/*.pot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = ["integration: requires explicitly prepared upstream sources or isolated services"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["octoprint_mqttforusbrelaycontrol"]

[tool.coverage.report]
show_missing = true
